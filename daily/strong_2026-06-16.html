<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>强势股策略看板 - 2026-06-16</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #080b11;
            --header-bg: rgba(8, 11, 17, 0.85);
            --card-bg: rgba(18, 24, 38, 0.65);
            --card-border: rgba(255, 255, 255, 0.05);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --primary: #6366f1;
            --stock-up: #ef4444;
            --stock-down: #10b981;
            --stock-none: #64748b;
            --safe-area-inset-bottom: env(safe-area-inset-bottom, 0px);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            padding-bottom: calc(30px + var(--safe-area-inset-bottom));
            line-height: 1.4;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            position: relative;
        }

        /* Sticky Header */
        .sticky-header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: var(--header-bg);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            padding: 0.85rem 1rem 0.65rem 1rem;
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.65rem;
        }

        .title-group h1 {
            font-size: 1.25rem;
            font-weight: 700;
            background: linear-gradient(135deg, #ffffff, #c7d2fe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .title-group p {
            font-size: 0.725rem;
            color: var(--text-muted);
            margin-top: 1px;
        }

        .date-pill {
            background: rgba(99, 102, 241, 0.12);
            border: 1px solid rgba(99, 102, 241, 0.25);
            color: #a5b4fc;
            font-size: 0.7rem;
            font-weight: 600;
            padding: 0.25rem 0.6rem;
            border-radius: 9999px;
            font-family: 'Outfit', sans-serif;
        }

        /* Stats Grid */
        .stats-summary {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 0.5rem;
            margin: 0.75rem 1rem 0.25rem 1rem;
        }

        .stat-pill {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 0.5rem;
            padding: 0.5rem 0.25rem;
            text-align: center;
        }

        .stat-pill-num {
            font-size: 0.95rem;
            font-weight: 700;
            font-family: 'Outfit', sans-serif;
        }

        .stat-pill-label {
            font-size: 0.6rem;
            color: var(--text-muted);
            margin-top: 2px;
        }

        /* Filter Controls */
        .search-row {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 0.55rem;
        }

        .search-box {
            position: relative;
            flex: 1;
        }

        .search-input {
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 0.5rem;
            padding: 0.45rem 0.75rem 0.45rem 1.85rem;
            color: var(--text-main);
            font-size: 0.85rem;
            outline: none;
            transition: all 0.2s;
        }

        .search-input:focus {
            border-color: var(--primary);
            background: rgba(255, 255, 255, 0.08);
        }

        .search-icon {
            position: absolute;
            left: 0.65rem;
            top: 50%;
            transform: translateY(-50%);
            width: 12px;
            height: 12px;
            color: var(--text-muted);
            stroke-width: 2.5;
        }

        .tabs-row {
            display: flex;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 0.15rem;
            border-radius: 0.5rem;
        }

        .tab-item {
            flex: 1;
            text-align: center;
            padding: 0.45rem 0;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-muted);
            background: transparent;
            border: none;
            border-radius: 0.35rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .tab-item.active {
            background: var(--primary);
            color: #ffffff;
            box-shadow: 0 2px 8px rgba(99, 102, 241, 0.25);
        }

        /* Sort Bar */
        .sort-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.45rem 1rem;
            font-size: 0.725rem;
            color: var(--text-muted);
            background: rgba(255, 255, 255, 0.01);
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
        }

        .sort-options {
            display: flex;
            gap: 0.75rem;
        }

        .sort-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 2px;
            font-size: 0.725rem;
        }

        .sort-btn.active {
            color: var(--primary);
        }

        .sort-btn .dir-icon {
            font-family: monospace;
            font-size: 0.75rem;
        }

        /* Stocks Cards Feed */
        .stocks-list {
            padding: 0.75rem 0.85rem;
            display: flex;
            flex-direction: column;
            gap: 0.65rem;
        }

        .stock-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 0.75rem;
            padding: 0.8rem 0.9rem;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.12);
            transition: transform 0.15s, background-color 0.15s;
        }

        .stock-card:active {
            transform: scale(0.98);
            background: rgba(22, 30, 49, 0.95);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.5rem;
        }

        .stock-meta {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .name-and-tag {
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .stock-name {
            font-size: 0.95rem;
            font-weight: 700;
            color: #ffffff;
        }

        .trigger-badge {
            font-size: 0.6rem;
            font-weight: 600;
            padding: 0.05rem 0.35rem;
            border-radius: 0.25rem;
        }

        .trigger-badge.left-buy {
            background: rgba(59, 130, 246, 0.15);
            color: #60a5fa;
            border: 1px solid rgba(59, 130, 246, 0.25);
        }

        .trigger-badge.right-buy {
            background: rgba(236, 72, 153, 0.15);
            color: #f472b6;
            border: 1px solid rgba(236, 72, 153, 0.25);
        }

        .stock-code-badge {
            display: inline-flex;
            align-items: center;
            gap: 3px;
            color: var(--primary);
            font-family: 'Outfit', monospace;
            font-weight: 600;
            font-size: 0.75rem;
            text-decoration: none;
            padding: 1px 0;
            align-self: flex-start;
        }

        .stock-code-badge svg {
            width: 10px;
            height: 10px;
        }

        .stock-prices {
            display: flex;
            align-items: center;
            gap: 0.65rem;
        }

        .price-info {
            text-align: right;
        }

        .latest-price {
            font-size: 1.15rem;
            font-weight: 700;
            font-family: 'Outfit', monospace;
            color: #ffffff;
            line-height: 1.1;
        }

        .latest-price.up {
            color: var(--stock-up);
        }

        .latest-price.down {
            color: var(--stock-down);
        }

        .latest-price.none {
            color: var(--text-main);
        }

        .stop-loss {
            font-size: 0.65rem;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .stop-loss span {
            color: #f87171;
            font-weight: 600;
            font-family: 'Outfit', monospace;
        }

        .change-pill {
            min-width: 70px;
            text-align: center;
            padding: 0.35rem 0.45rem;
            border-radius: 0.375rem;
            font-family: 'Outfit', monospace;
            font-weight: 700;
            font-size: 0.85rem;
            color: #ffffff;
        }

        .change-pill.up {
            background: var(--stock-up);
            box-shadow: 0 2px 8px rgba(239, 68, 68, 0.2);
        }

        .change-pill.down {
            background: var(--stock-down);
            box-shadow: 0 2px 8px rgba(16, 185, 129, 0.2);
        }

        .change-pill.none {
            background: var(--stock-none);
        }

        /* Rationale Body */
        .card-body {
            background: rgba(0, 0, 0, 0.18);
            border-radius: 0.4rem;
            padding: 0.55rem 0.7rem;
            margin-top: 0.45rem;
            font-size: 0.775rem;
            line-height: 1.4;
            color: #cbd5e1;
            border: 1px solid rgba(255, 255, 255, 0.02);
        }

        .logic-label {
            font-size: 0.65rem;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 2px;
            text-transform: uppercase;
            letter-spacing: 0.03em;
        }

        .card-footer {
            display: flex;
            justify-content: flex-end;
            margin-top: 0.4rem;
            font-size: 0.65rem;
            color: var(--text-muted);
            font-family: 'Outfit', sans-serif;
        }

        /* Empty State */
        .empty-state {
            display: none;
            text-align: center;
            padding: 4rem 2rem;
            color: var(--text-muted);
        }

        .empty-state svg {
            width: 36px;
            height: 36px;
            margin-bottom: 0.5rem;
            opacity: 0.3;
            stroke: currentColor;
        }
    </style>
</head>

            });
        });

        // Sorting handlers
        document.querySelectorAll('.sort-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const col = btn.dataset.sort;
                
                // Clear directions on other buttons
                document.querySelectorAll('.sort-btn').forEach(b => {

                        b.classList.remove('active');
                        const icon = b.querySelector('.dir-icon');
                        if (icon) icon.textContent = '';
                    }
                });

                btn.classList.add('active');
                
                if (sortColumn === col) {
                    sortDirection = sortDirection === 'asc' ? 'desc' : 'asc';
                } else {
                    sortColumn = col;
                    sortDirection = 'desc'; // default to desc for stock stats
                }
                
                const icon = btn.querySelector('.dir-icon');
                if (icon) icon.textContent = sortDirection === 'asc' ? '↑' : '↓';

            });

                return matchesTab && matchesSearch;
            });

            // Sort

                        valA = parseFloat(valA) || 0;
                        valB = parseFloat(valB) || 0;
                    } else if (sortColumn === 'change_percent') {
                        valA = parseFloat(valA.replace('%', '')) || 0;
                        valB = parseFloat(valB.replace('%', '')) || 0;
                    }

                    if (valA < valB) return sortDirection === 'asc' ? -1 : 1;

                    return 0;
                });
